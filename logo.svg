<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" role="img" aria-label="Frisco Fence Company">
  <defs>
    <linearGradient id="postGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="100%" style="stop-color:#5C4510"/>
    </linearGradient>
    <linearGradient id="slatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#2E5491"/>
    </linearGradient>
  </defs>
  <!-- Fence icon -->
  <g transform="translate(8, 12)">
    <rect x="4" y="8" width="6" height="52" rx="1" fill="url(#postGrad)"/>
    <rect x="58" y="8" width="6" height="52" rx="1" fill="url(#postGrad)"/>
    <rect x="31" y="8" width="6" height="52" rx="1" fill="url(#postGrad)"/>
    <rect x="2" y="18" width="64" height="5" rx="1" fill="url(#slatGrad)"/>
    <rect x="2" y="32" width="64" height="5" rx="1" fill="url(#slatGrad)"/>
    <rect x="2" y="46" width="64" height="5" rx="1" fill="url(#slatGrad)"/>
    <polygon points="7,8 10,2 13,8" fill="#1E3A5F"/>
    <polygon points="34,8 37,2 40,8" fill="#1E3A5F"/>
    <polygon points="61,8 64,2 67,8" fill="#1E3A5F"/>
  </g>
  <!-- Company name -->
  <text x="88" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#1E3A5F">Frisco Fence</text>
  <text x="88" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#B87333" letter-spacing="3">COMPANY</text>
</svg>
